# Cutover (DPTP-4267): replicas 1. app.ci horologium must be 0 to avoid double periodics.
# See clusters/core-ci/prow/CUTOVER.md
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci
  name: horologium
  labels:
    app: prow
    component: horologium
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: prow
      component: horologium
  template:
    metadata:
      labels:
        app: prow
        component: horologium
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker-prow-services: worker-prow-services
      tolerations:
      - key: node-role.kubernetes.io/worker-prow-services
        operator: Equal
        value: worker-prow-services
        effect: NoSchedule
      serviceAccountName: horologium
      initContainers:
      - name: git-sync-init
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
      containers:
      - name: horologium
        args:
        - --config-path=/etc/config/config.yaml
        - --supplemental-prow-config-dir=/etc/config
        - --job-config-path=/var/repo/release/ci-operator/jobs
        - --projected-token-file=/var/sa-token/token
        - --dry-run=false
        image: us-docker.pkg.dev/k8s-infra-prow/images/horologium:v20260714-0633879af
        volumeMounts:
        - name: service-account-token
          mountPath: /var/sa-token
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: release
          mountPath: /var/repo
        resources:
          requests:
            memory: "2Gi"
            cpu: "100m"
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
      volumes:
      - name: service-account-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
      - name: config
        configMap:
          name: config
      - name: release
        emptyDir: {}
