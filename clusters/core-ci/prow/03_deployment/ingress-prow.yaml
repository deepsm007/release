# Production DNS for Prow on core-ci (DPTP-4267 cutover).
# Requires cert-manager ClusterIssuer `cert-issuer` on core-ci (already used by other certs).
# Cutover also updates GitHub App webhook URL to https://hook.ci.openshift.org/hook
# See CUTOVER.md — sync only after core-ci Prow is healthy; freeze app.ci in same PR.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cert-issuer
    haproxy.router.openshift.io/timeout: "90s"
  name: prow
  namespace: ci
spec:
  ingressClassName: openshift-default
  tls:
  - secretName: prow-tls
    hosts:
    - prow.ci.openshift.org
    - hook.ci.openshift.org
  rules:
  - host: prow.ci.openshift.org
    http:
      paths:
      - backend:
          service:
            name: deck
            port:
              number: 80
        pathType: ImplementationSpecific
  - host: hook.ci.openshift.org
    http:
      paths:
      - backend:
          service:
            name: hook
            port:
              number: 8888
        pathType: ImplementationSpecific
