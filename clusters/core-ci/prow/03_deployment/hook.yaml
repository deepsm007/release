# ClusterIP only for Service. Route uses default apps hostname for manual testing —
# NOT hook.ci.openshift.org (no DNS / GitHub cutover).
apiVersion: v1
kind: Service
metadata:
  namespace: ci
  name: hook
  labels:
    app: prow
    component: hook
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
spec:
  selector:
    app: prow
    component: hook
  ports:
  - name: main
    port: 8888
  - name: metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  type: ClusterIP
---
# Default apps host only (hook-ci.apps.master.ci.devcluster.openshift.com).
# Do not set spec.host to hook.ci.openshift.org.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  namespace: ci
  name: hook
  labels:
    app: prow
    component: hook
spec:
  path: /hook
  port:
    targetPort: 8888
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: hook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci
  name: hook
  labels:
    app: prow
    component: hook
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: prow
      component: hook
  template:
    metadata:
      labels:
        app: prow
        component: hook
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker-prow-services: worker-prow-services
      tolerations:
      - key: node-role.kubernetes.io/worker-prow-services
        operator: Equal
        value: worker-prow-services
        effect: NoSchedule
      serviceAccountName: hook
      initContainers:
      - name: git-sync-init
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
      containers:
      - name: hook
        image: us-docker.pkg.dev/k8s-infra-prow/images/hook:v20260714-0633879af
        args:
        - --config-path=/etc/config/config.yaml
        - --supplemental-prow-config-dir=/etc/config
        - --hmac-secret-file=/etc/github/hmac
        - --dry-run=false
        - --job-config-path=/var/repo/release/ci-operator/jobs
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-graphql-endpoint=http://ghproxy/graphql
        - --bugzilla-endpoint=https://bugzilla.redhat.com
        - --bugzilla-api-key-path=/etc/bugzilla/api
        - --bugzilla-auth-method=bearer
        - --jira-endpoint=https://redhat.atlassian.net
        - --jira-username=aos-team-dp-testplatform@redhat.com
        - --jira-password-file=/etc/jira/password
        - --projected-token-file=/var/sa-token/token
        - --plugin-config=/var/repo/release/core-services/prow/02_config/_plugins.yaml
        - --supplemental-plugin-config-dir=/var/repo/release/core-services/prow/02_config
        - --kubeconfig-dir=/etc/build-farm-credentials
        - --kubeconfig-suffix=config
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: openshift-prow-github-app
              key: appid
        ports:
          - name: main
            containerPort: 8888
          - name: metrics
            containerPort: 9090
        volumeMounts:
        - name: service-account-token
          mountPath: /var/sa-token
        - name: github-app-credentials
          mountPath: /etc/github
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: bugzilla
          mountPath: /etc/bugzilla
          readOnly: true
        - name: jira
          mountPath: /etc/jira
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: release
          mountPath: /var/repo
        - mountPath: /etc/build-farm-credentials
          name: build-farm-credentials
          readOnly: true
        resources:
          requests:
            memory: "4Gi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8081
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
      volumes:
      - name: service-account-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
      - name: github-app-credentials
        secret:
          secretName: openshift-prow-github-app
      - name: bugzilla
        secret:
          secretName: bugzilla-credentials-openshift-bugzilla-robot
      - name: jira
        secret:
          secretName: jira-token-dptp-bot
      - name: config
        configMap:
          name: config
      - name: release
        emptyDir: {}
      - name: build-farm-credentials
        secret:
          secretName: hook
      - name: tmp
        emptyDir: {}
