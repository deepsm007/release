---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-controller
  namespace: ci
spec:
  selector:
    app: prow
    component: pipeline-controller
  ports:
  - port: 80
    targetPort: 8888
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci
  name: pipeline-controller
  labels:
    app: prow
    component: pipeline-controller
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: prow
      component: pipeline-controller
      flavor: apps-auth
  template:
    metadata:
      annotations:
        ci-workload-autoscaler.openshift.io/scale: "false"
      labels:
        app: prow
        component: pipeline-controller
        flavor: apps-auth
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: prow
                component: pipeline-controller
            topologyKey: kubernetes.io/hostname
      serviceAccountName: pipeline-controller
      initContainers:
        - name: git-sync-init
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          command:
            - /git-sync
          args:
            - --repo=https://github.com/openshift/release.git
            - --ref=main
            - --root=/tmp/git-sync
            - --one-time=true
            - --depth=1
            - --link=release
          image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
          volumeMounts:
            - name: release
              mountPath: /tmp/git-sync
      containers:
        - name: pipeline-controller
          image: quay-proxy.ci.openshift.org/openshift/ci:ci_pipeline-controller_latest
          imagePullPolicy: Always
          args:
            - --config-path=/etc/config/config.yaml
            - --supplemental-prow-config-dir=/etc/config
            - --job-config-path=/var/repo/release/ci-operator/jobs
            - --github-app-id=$(GITHUB_APP_ID)
            - --github-app-private-key-path=/etc/github/cert
            - --github-endpoint=http://ghproxy
            - --github-endpoint=https://api.github.com
            - --github-graphql-endpoint=http://ghproxy/graphql
            - --config-file=/var/repo/release/core-services/pipeline-controller/config.yaml
            - --lgtm-config-file=/var/repo/release/core-services/pipeline-controller/lgtm-config.yaml
            - --hmac-secret-file=/etc/webhook/hmac.yaml
            - --endpoint=/
          env:
          - name: GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: openshift-merge-bot
                key: appid
          resources:
            requests:
              memory: "14Gi"
              cpu: "400m"
            limits:
              memory: "22Gi"
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: github-app-credentials
              mountPath: /etc/github
              readOnly: true
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: release
              mountPath: /var/repo
            - name: hmac
              mountPath: /etc/webhook
              readOnly: true
        - name: git-sync
          command:
            - /git-sync
          args:
            - --repo=https://github.com/openshift/release.git
            - --ref=main
            - --period=30s
            - --root=/tmp/git-sync
            - --max-failures=3
            - --link=release
          image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
          volumeMounts:
            - name: release
              mountPath: /tmp/git-sync
          resources:
            requests:
              memory: "256Mi"
              cpu: "0.5"
            limits:
              memory: "2Gi"
      volumes:
        - name: hmac
          secret:
            secretName: github-webhook-credentials
        - name: github-app-credentials
          secret:
            secretName: openshift-merge-bot
        - name: config
          configMap:
            name: config
        - name: release
          emptyDir: {}
